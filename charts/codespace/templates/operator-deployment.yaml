{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codespace.operator.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codespace.operator.labels" . | nindent 4 }}
  {{- $annotations := include "codespace.operator.annotations" . }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "codespace.selectorLabels" (dict "name" (include "codespace.name" .) "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "codespace.operator.podLabels" . | nindent 8 }}
      {{- $podAnnotations := include "codespace.operator.podAnnotations" . }}
      {{- if $podAnnotations }}
      annotations:
        {{- $podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "codespace.serviceAccountName" . }}
      {{- with .Values.operator.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: session-controller
          image: {{ include "codespace.operator.image" . }}
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: CODESPACE_CONTROLLER_INIT_IMAGE
              value: {{ .Values.operator.init.image | quote }}
            - name: CODESPACE_CONTROLLER_INIT_USER
              value: {{ .Values.operator.init.user | quote }}
            - name: CODESPACE_CONTROLLER_INIT_GROUP
              value: {{ .Values.operator.init.group | quote }}
            {{- range $k, $v := .Values.operator.init.extraEnv }}
            - name: {{ printf "CODESPACE_CONTROLLER_INIT_EXTRA_ENV__%s" ($k | upper | replace "-" "_" ) }}
              value: {{ $v | quote }}
            {{- end }}
            # -------- Profile store mode for operator --------
            - name: CODESPACE_CONTROLLER_PROFILE_STORE_KIND
              value: {{ ternary "http" "postgres" (eq .Values.operator.profileStoreMode "http") | quote }}

            {{- if eq .Values.operator.profileStoreMode "http" }}
            # Operator talks to the server (baseURL + shared token)
            - name: CODESPACE_CONTROLLER_PROFILE_STORE_BASE_URL
              value: {{ include "codespace.server.internalURL" . | quote }}
            {{- if .Values.profileStore.token }}
            - name: CODESPACE_CONTROLLER_PROFILE_STORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "codespace.operator.name" . }}
                  key: profile-store-token
            {{- end }}
            {{- end }}

            {{- if eq .Values.operator.profileStoreMode "postgres" }}
            # Operator reads DB directly (same DSN as server)
            {{- if .Values.profileStore.dsn }}
            - name: CODESPACE_CONTROLLER_PROFILE_STORE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "codespace.operator.name" . }}
                  key: profile-store-dsn
            {{- end }}
            {{- end }}
          args:
            - "--metrics-bind-address={{ ternary .Values.operator.metrics.bindAddress "0" (not .Values.operator.metrics.enabled) }}"
            - "--metrics-secure={{ ternary "true" "false" .Values.operator.metrics.secure }}"
            - "--health-probe-bind-address=:8081"
            - "--enable-http2={{ ternary "true" "false" .Values.operator.enableHTTP2 }}"
            {{- if .Values.operator.webhook.enabled }}
            - "--webhook-cert-path={{ .Values.operator.webhook.certPath }}"
            - "--webhook-cert-name={{ .Values.operator.webhook.certName }}"
            - "--webhook-cert-key={{ .Values.operator.webhook.certKey }}"
            {{- end }}
            {{- range .Values.operator.extraArgs }}
            - "{{ . }}"
            {{- end }}
          ports:
            {{- if and .Values.operator.metrics.enabled .Values.operator.metrics.secure }}
            - name: https-metrics
              containerPort: 8443
              protocol: TCP
            {{- else if and .Values.operator.metrics.enabled (not .Values.operator.metrics.secure) }}
            - name: http-metrics
              containerPort: 8080
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.operator.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}