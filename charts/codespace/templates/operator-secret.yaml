{{- if .Values.operator.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codespace.operator.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "codespace.operator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.profileStore.token }}
  profile-store-token: {{ .Values.profileStore.token | b64enc }}
  {{- end }}
  {{- if .Values.profileStore.dsn }}
  profile-store-dsn: {{ .Values.profileStore.dsn | b64enc }}
  {{- end }}
{{- end }}
